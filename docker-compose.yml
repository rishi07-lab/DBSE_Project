# CarePulse HMS - microservices + frontend.
# MySQL is NOT started here: the services connect to YOUR EXISTING MySQL on the host machine
# (port 3306) through host.docker.internal, so your hospital_management data is used as-is.
#
#   1. cp backend/.env.example backend/.env   (set JWT_SECRET; DB_PASSWORD is already "Root")
#   2. make sure the schema/seed has been applied once:  docker compose --profile tools run --rm db-seed
#   3. docker compose up --build
#   4. open http://localhost:8080
#
# MySQL must accept connections from Docker (bind-address = 0.0.0.0 or the Docker bridge) and the
# `root` user must be allowed to connect from that address.

x-backend: &backend
  env_file: ./backend/.env
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &backend-env
    DB_HOST: host.docker.internal
    DB_PORT: 3306

services:
  auth-service:
    <<: *backend
    build: { context: ./backend, args: { SERVICE: auth } }
    environment: { <<: *backend-env, AUTH_PORT: 5001 }

  clinical-service:
    <<: *backend
    build: { context: ./backend, args: { SERVICE: clinical } }
    environment: { <<: *backend-env, CLINICAL_PORT: 5002 }

  pharmacy-service:
    <<: *backend
    build: { context: ./backend, args: { SERVICE: pharmacy } }
    environment: { <<: *backend-env, PHARMACY_PORT: 5003 }

  lab-service:
    <<: *backend
    build: { context: ./backend, args: { SERVICE: lab } }
    environment: { <<: *backend-env, LAB_PORT: 5004 }

  billing-service:
    <<: *backend
    build: { context: ./backend, args: { SERVICE: billing } }
    environment: { <<: *backend-env, BILLING_PORT: 5005 }

  analytics-service:
    <<: *backend
    build: { context: ./backend, args: { SERVICE: analytics } }
    environment: { <<: *backend-env, ANALYTICS_PORT: 5006 }

  gateway:
    <<: *backend
    build: { context: ./backend, args: { SERVICE: gateway } }
    ports: ["5000:5000"]
    environment:
      <<: *backend-env
      GATEWAY_PORT: 5000
      AUTH_URL: http://auth-service:5001
      CLINICAL_URL: http://clinical-service:5002
      PHARMACY_URL: http://pharmacy-service:5003
      LAB_URL: http://lab-service:5004
      BILLING_URL: http://billing-service:5005
      ANALYTICS_URL: http://analytics-service:5006
    depends_on: [auth-service, clinical-service, pharmacy-service, lab-service, billing-service, analytics-service]

  frontend:
    build: ./DBSE_Project
    ports: ["8080:80"]
    depends_on: [gateway]

  # One-off helper: docker compose --profile tools run --rm db-seed
  db-seed:
    <<: *backend
    profiles: ["tools"]
    restart: "no"
    build: { context: ./backend, args: { SERVICE: gateway } }
    command: ["node", "db/seed.js"]
